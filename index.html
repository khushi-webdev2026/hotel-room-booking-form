<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>first project</title>
    <link rel="stylesheet" href="first project.css">
</head>
<body>
    <h1>Hotal Room Booking Form</h1>
    <div class="container">
    <form>
        <h2>Guest Information</h2>
        <br>
        <label >Full Name:</label>
        <input type="text" placeholder="Enter Your Name">
        <br>
        <br>
        <label>Email Address:</label>
        <input type="text" placeholder="Enter Your Email">
        <br>
        <br>
        <label >Mobile Number:</label>
        <input type="text" placeholder="Enter Mobile No.">
        <br>
        <br>
        <h2>Booking Details</h2>
        <br>
        <label>Check-in Date:</label>
        <input type="datetime-local" placeholder="check-in date">
        <br>
        <br>
        <label>Check-out Date:</label>
        <input type="datetime-local" placeholder="check-out date">
        <br>
        <br>
        <label>Number Of Guests:</label>
        <input type="text" placeholder="fill the no.">
        <br>
        <br>
        <label>Number Of Room:</label>
        <select name="no.of room">
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9 etc.</option>
        </select>
        <br>
        <br>
        <h2>Room Type</h2>
        <br>
        <label for="single room">Single Room</label>
        <input type="radio" name="select">
        <label for="double room">Double Room</label>
        <input type="radio" name="select">
        <label for="deluxe room">Deluxe Room</label>
        <input type="radio" name="select">
        <label for="family room">Family Room</label>
        <input type="radio" name="select">
        <br>
        <br>
        <h2>Additional Facilities</h2>
        <br>
        <input type="checkbox">
        <label>Breakfast</label>
        <br>
        <input type="checkbox">
        <label>Wi-Fi</label>
        <br>
        <input type="checkbox">
        <label>Room Service</label>
        <br>
        <input type="checkbox">
        <label>Swimming Pool</label>
        <br>
        <br>
        <h2>Special Requist</h2>
        <br>
        <textarea>special requist</textarea>
        <br>
        <br>
        <h2>Payment Method</h2>
        <br>
        <select name="payment method">
            <option>Cash</option>
            <option>UPI</option>
            <option>Card</option>
            <option>paytm</option>
            <option>phonepay</option>
        </select>
        <br>
        <br>
        <button>Book Now</button>
        <button>Reset</button>
    </div>
    </form>

</body>
</html>
